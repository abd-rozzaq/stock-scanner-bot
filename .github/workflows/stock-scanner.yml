name: Daily Stock Scanner BEI

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 9:00 WIB Senin-Jumat
    - cron: '0 8 * * 1-5'     # 15:50 WIB Senin-Jumat
  workflow_dispatch:          # Manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests python-telegram-bot

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit data.csv changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/data.csv
          git diff --staged --quiet || git commit -m "Update data.csv $(date)"
          git push
